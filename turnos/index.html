<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Turnos 7x7</title>
  <meta name="description" content="Calendario de turnos 7x7 editable: día, noche, descanso, vacaciones, permisos y cursos.">
  <meta name="theme-color" content="#f1f1ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Turnos">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 id="title">Hoy</h1>
      <span class="spacer"></span>
      <button class="icon-btn" data-action="go" data-tab="ajustes" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm0 5.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm8.4-3.2-1.6-.3a7 7 0 0 0-.6-1.5l.9-1.4a.8.8 0 0 0-.1-1l-1.6-1.6a.8.8 0 0 0-1-.1l-1.4.9a7 7 0 0 0-1.5-.6l-.3-1.6A.8.8 0 0 0 12.4 2h-2.3a.8.8 0 0 0-.8.6l-.3 1.6a7 7 0 0 0-1.5.6l-1.4-.9a.8.8 0 0 0-1 .1L3.5 5.6a.8.8 0 0 0-.1 1l.9 1.4a7 7 0 0 0-.6 1.5l-1.6.3a.8.8 0 0 0-.6.8v2.3c0 .4.3.7.6.8l1.6.3c.1.5.3 1 .6 1.5l-.9 1.4a.8.8 0 0 0 .1 1l1.6 1.6c.3.3.7.3 1 .1l1.4-.9c.5.3 1 .5 1.5.6l.3 1.6c.1.4.4.6.8.6h2.3c.4 0 .7-.3.8-.6l.3-1.6c.5-.1 1-.3 1.5-.6l1.4.9c.3.2.7.2 1-.1l1.6-1.6c.3-.3.3-.7.1-1l-.9-1.4c.3-.5.5-1 .6-1.5l1.6-.3c.4-.1.6-.4.6-.8v-2.3a.8.8 0 0 0-.6-.8Z"/></svg>
      </button>
    </div>
    <div class="month-nav" id="periodNav" hidden>
      <button class="icon-btn" data-action="period" data-delta="-1" aria-label="Anterior">‹</button>
      <button class="month-label" id="periodLabel" data-action="period-today"></button>
      <button class="icon-btn" data-action="period" data-delta="1" aria-label="Siguiente">›</button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button data-action="go" data-tab="hoy" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9Zm0 16a7 7 0 1 1 7-7 7 7 0 0 1-7 7Zm.8-11.5h-1.6v5.2l4.4 2.6.8-1.3-3.6-2.1Z"/></svg>
      <span>Hoy</span>
    </button>
    <button data-action="go" data-tab="mes" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7Zm-2 8h14v10H5V10Zm2 2v2h2v-2H7Zm4 0v2h2v-2h-2Zm4 0v2h2v-2h-2Zm-8 4v2h2v-2H7Zm4 0v2h2v-2h-2Z"/></svg>
      <span>Mes</span>
    </button>
    <button data-action="add" class="tab tab-add" aria-label="Agregar vacaciones, permiso, curso…">
      <span class="plus">+</span>
    </button>
    <button data-action="go" data-tab="anio" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3V3Zm2 2v4h4V5H5Zm8-2h8v8h-8V3Zm2 2v4h4V5h-4ZM3 13h8v8H3v-8Zm2 2v4h4v-4H5Zm8-2h8v8h-8v-8Zm2 2v4h4v-4h-4Z"/></svg>
      <span>Año</span>
    </button>
    <button data-action="go" data-tab="resumen" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3v10H4Zm6.5 0V4h3v16h-3ZM17 20v-7h3v7h-3Z"/></svg>
      <span>Resumen</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="backdrop" data-action="close-sheet" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="js/app.js"></script>
</body>
</html>
